[project]
name = "lazyreader"
version = "0.1.0"
description = "LazyReader - Text Processing and Translation Platform"
authors = [{ name = "Your Name", email = "your@email.com" }]
license = "MIT"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = [
    "tests/test_*.py",
    "tests/**/test_*.py"
]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E203",
    "W503"
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "__init__.py"
]
per-file-ignores = { "__init__.py" = "F401" }

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
line_length = 120
known_first_party = [
    "app",
    "domain",
    "infrastructure",
    "interfaces",
    "core",
    "events",
    "tests"
]
