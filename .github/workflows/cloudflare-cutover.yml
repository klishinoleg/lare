name: Cut over Lazy Reader Cloudflare DNS

on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: IPv4 origin address for Lazy Reader
        required: true
        default: 51.75.69.123
      proxied:
        description: Keep records proxied through Cloudflare
        required: true
        default: "true"

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Update DNS records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_IP: ${{ inputs.target_ip }}
          PROXIED: ${{ inputs.proxied }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          target_ip = os.environ["TARGET_IP"].strip()
          proxied = os.environ.get("PROXIED", "true").strip().lower() == "true"
          zone_name = "lazy-reader.com"
          hostnames = [
              "lazy-reader.com",
              "www.lazy-reader.com",
              "tg.lazy-reader.com",
              "server.lazy-reader.com",
          ]

          if not token:
              raise SystemExit("Missing GitHub secret CLOUDFLARE_API_TOKEN")

          def request(method, path, payload=None):
              data = None
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              }
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"Cloudflare API error {exc.code}: {body}") from exc
              parsed = json.loads(body)
              if not parsed.get("success"):
                  raise SystemExit(f"Cloudflare API failure: {parsed}")
              return parsed["result"]

          zones = request(
              "GET",
              f"/zones?name={urllib.parse.quote(zone_name)}&status=active&per_page=1",
          )
          if not zones:
              raise SystemExit(f"Cloudflare zone not found: {zone_name}")
          zone_id = zones[0]["id"]

          for hostname in hostnames:
              encoded = urllib.parse.quote(hostname)
              records = request(
                  "GET",
                  f"/zones/{zone_id}/dns_records?name={encoded}&per_page=100",
              )

              for record in records:
                  if record["type"] in {"AAAA", "CNAME"}:
                      request("DELETE", f"/zones/{zone_id}/dns_records/{record['id']}")
                      print(f"deleted {record['type']} {hostname}")

              a_records = [record for record in records if record["type"] == "A"]
              payload = {
                  "type": "A",
                  "name": hostname,
                  "content": target_ip,
                  "ttl": 1,
                  "proxied": proxied,
              }
              if a_records:
                  request(
                      "PATCH",
                      f"/zones/{zone_id}/dns_records/{a_records[0]['id']}",
                      payload,
                  )
                  for record in a_records[1:]:
                      request("DELETE", f"/zones/{zone_id}/dns_records/{record['id']}")
                  print(f"updated A {hostname} -> {target_ip} proxied={proxied}")
              else:
                  request("POST", f"/zones/{zone_id}/dns_records", payload)
                  print(f"created A {hostname} -> {target_ip} proxied={proxied}")

          print("Cloudflare DNS cutover complete")
          PY
